[project]
name = "mgnifyapi"
dynamic = [ "version" ]
description = "Microbial Association Networks using Graphs on Omics data (MANGO)"
authors = [
    { name = "MoNA Group"},
    { name = "Sebastian Ayala Ruano" },
    { name = "Marco Reverenna", email = "marcor@dtu.dk" },
    { name = "Angel L. P." },
    { name = "Alberto Santos", email = "albsad@dtu.dk" }
]
license = {text = "MIT"}
readme = "README.md"
keywords = [
    "computational biology", 
    "microbiome", 
    "mgnify"
] 
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",    
]
requires-python = ">=3.9"

[project.urls]
homepage = "https://github.com/Multiomics-Analytics-Group/Retrieve_info_MGnifyAPI"
repository = "https://github.com/Multiomics-Analytics-Group/Retrieve_info_MGnifyAPI"
#documentation = "https://mona-mango.readthedocs.io"
"Bug Tracker" = "https://github.com/Multiomics-Analytics-Group/Retrieve_info_MGnifyAPI/issues"

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.3"
numpy = "^2.2.2"
scipy = "^1.15.1"
jsonapi-client = "^0.9.9"
requests = "^2.32.3"
azure-storage-blob = "^12.24.1"
pyyaml = "^6.0.2"
matplotlib = "^3.10.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
ruff = "^0.9.6"
black = {extras = ["jupyter"], version = "^25.1.0"}
pytest = "^8.4.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^8.2.3"
sphinx-book-theme = "^1.1.4"
myst-nb = "^1.3.0"
ipywidgets = "^8.1.7"
sphinx-new-tab-link = "^0.8.0"
jupytext = "^1.17.2"
sphinx-copybutton = "^0.5.2"

[tool.ruff.lint]
extend-select = ["E", "W", "F", "B"]
# ignore = ["E501"]

[tool.isort]
profile = "black"

[tool.poetry]
version = "0.0.0"
packages = [
    {include = "mgnifyapi"}
]

[tool.poetry.scripts]
mgnifyapi-get-studies = "mgnifyapi.get_studies:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

